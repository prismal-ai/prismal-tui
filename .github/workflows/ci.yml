# TUI-00-06 — ruff + mypy + pytest (unit + ui, offline) on every push/PR;
# opt-in `contract` job against a running prismal-server (manual dispatch).
#
# prismal-sdk 0.2 is not on PyPI yet, so it is checked out next to this repo
# to satisfy `[tool.uv.sources] prismal-sdk = { path = "../prismal-sdk" }`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      contract_server_url:
        description: "Run the contract suite against this prismal-server URL (blank = skip)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prismal-tui
    steps:
      - uses: actions/checkout@v4
        with:
          path: prismal-tui
      - uses: actions/checkout@v4
        with:
          repository: prismal-ai/prismal-sdk
          path: prismal-sdk
          token: ${{ secrets.PRISMAL_SDK_TOKEN || github.token }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install
        run: uv sync --locked --extra dev
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: Mypy
        run: uv run mypy prismal_tui
      - name: Pytest (unit + ui, offline)
        run: uv run pytest --cov --cov-report=term-missing

  contract:
    if: github.event_name == 'workflow_dispatch' && inputs.contract_server_url != ''
    needs: checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prismal-tui
    steps:
      - uses: actions/checkout@v4
        with:
          path: prismal-tui
      - uses: actions/checkout@v4
        with:
          repository: prismal-ai/prismal-sdk
          path: prismal-sdk
          token: ${{ secrets.PRISMAL_SDK_TOKEN || github.token }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra dev
      - name: Pytest (contract)
        env:
          PRISMAL_TUI_SERVER_URL: ${{ inputs.contract_server_url }}
          PRISMAL_TUI_TOKEN: ${{ secrets.PRISMAL_TUI_CONTRACT_TOKEN }}
        run: uv run pytest -m contract
